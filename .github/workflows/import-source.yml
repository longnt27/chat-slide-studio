name: Import Chat Slide Studio v2 source
on:
  push:
    branches: [main]
    paths:
      - bootstrap/source.tar.xz
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify package integrity and extract all files
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/source.tar.xz
          echo "826c773e30462fd15114d239845b57714add73715e0b5a0dbae5e2a1cd660fd1  bootstrap/source.tar.xz" | sha256sum --check
          tar -tJf bootstrap/source.tar.xz > /tmp/entries.txt
          test "$(grep -c '/[^/]*$' /tmp/entries.txt)" -ge 20
          tar -xJf bootstrap/source.tar.xz --strip-components=1 -C .
          test -f AGENTS.md
          test -f SKILL.md
          test -f CHAT_PROMPT.md
          test -f .github/workflows/build-slides.yml
          test -f scripts/build_deck.cjs
          test -f scripts/qa_pptx.py
          test -f decks/demo/deck.json
          python3 - <<'PY'
          import json
          obj = json.load(open('decks/demo/deck.json'))
          assert obj['requested_slide_count'] == 15
          assert len(obj['slides']) == 15
          print('Verified: 15-slide demo and core repo files')
          PY
          # GitHub Actions token cannot create a new workflow file.
          # Install the build workflow separately through the GitHub connector.
          rm -f .github/workflows/build-slides.yml
          rm -rf bootstrap/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "feat: import complete Chat Slide Studio v2"
            git push origin HEAD:main
          fi
